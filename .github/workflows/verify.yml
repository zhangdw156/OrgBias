name: Verify code and public evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/audit_git_privacy.py
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/verify_results.py
